name: flutter_app
description: 综合商城应用 - 基于 Flutter + Bloc + Hive + Retrofit 的完整商用项目
# 项目名称：Shopping Mall（综合商城）
# 技术栈：Flutter + Bloc(状态管理) + Hive(本地存储) + Dio/Retrofit(网络请求) + Material Design 3(UI)
# 后端接口：Spring Boot (RESTful API)
# 响应格式：{success: boolean, code: String, message: String, data: Object}
# 支持平台：iOS / Android
# 开发规范：所有代码包含详细中文注释，符合企业级开发标准

# 发布配置：设置为 none 防止意外发布到 pub.dev
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# ============================================
# 生产依赖（dependencies）
# ============================================
dependencies:
  # Flutter SDK 基础依赖
  flutter:
    sdk: flutter
  
  # ============================================
  # 状态管理：Flutter Bloc
  # ============================================
  # Bloc 库：核心状态管理，基于事件驱动和状态流
  flutter_bloc: ^8.1.3
  # Equatable：用于值比较，避免重写 == 和 hashCode
  equatable: ^2.0.5
  
  # ============================================
  # 网络请求：Dio
  # ============================================
  # Dio：强大的 HTTP 客户端，支持拦截器、全局配置等
  dio: ^5.9.2
  # JSON 序列化基础库
  json_annotation: ^4.8.1
  
  # ============================================
  # 本地存储：Hive
  # ============================================
  # Hive：高性能的 NoSQL 数据库，支持自定义对象存储
  hive: ^2.2.3
  # Hive Flutter：Hive 的 Flutter 扩展
  hive_flutter: ^1.1.0
  
  # ============================================
  # UI 组件与适配
  # ============================================
  # ScreenUtil：屏幕适配方案，根据不同设备尺寸自动调整
  flutter_screenutil: ^5.9.3
  # Cached Network Image：图片加载与缓存
  cached_network_image: ^3.3.1
  # Shimmer：骨架屏加载动画
  shimmer: ^3.0.0
  # 图标库
  font_awesome_flutter: ^11.0.0
  # Material Icons
  cupertino_icons: ^1.0.6
  
  # ============================================
  # 工具类
  # ============================================
  # Dartz：函数式编程工具，提供 Either 类型处理错误
  dartz: ^0.10.1
  # Get It：依赖注入服务定位器
  get_it: ^7.6.4
  # Inject Annotation：依赖注入注解
  injectable: ^2.3.2
  # Flutter Toast：吐司提示
  fluttertoast: ^8.2.4
  # Pull To Refresh：下拉刷新和上拉加载
  pull_to_refresh: ^2.0.0
  # Image Picker：图片选择器（头像上传等）
  image_picker: ^1.0.5
  # Path Provider：获取应用目录路径
  path_provider: ^2.1.2
  # Permission Handler：权限处理
  permission_handler: ^11.3.0
  # Shared Preferences：简单键值对存储（Token 等）
  shared_preferences: ^2.2.2
  # Connectivity Plus：网络状态检测
  connectivity_plus: ^5.0.2
  # Device Info Plus：设备信息获取
  device_info_plus: ^10.0.0
  # Url Launcher：打开外部链接
  url_launcher: ^6.2.4

# ============================================
# 开发依赖（dev_dependencies）
# ============================================
dev_dependencies:
  # Flutter 测试框架
  flutter_test:
    sdk: flutter
  
  # ============================================
  # 代码生成工具
  # ============================================
  # Build Runner：代码生成器核心
  build_runner: ^2.4.8
  # JSON Serializable：JSON 序列化代码生成
  json_serializable: ^6.7.1
  # Hive Generator：Hive 适配器代码生成
  hive_generator: ^2.0.1
  # Inject Generator：依赖注入代码生成
  injectable_generator: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# ============================================
# Flutter 配置部分
# ============================================
flutter:
  # 启用 Material Design 图标集
  uses-material-design: true
  
  # ============================================
  # 资源文件配置（assets）
  # ============================================
  # 图片、JSON 等静态资源文件目录
  assets:
    - assets/images/           # 图片资源目录
    - assets/icons/            # 图标资源目录
    - assets/animations/       # 动画资源目录（Lottie）
    - assets/data/             # 数据文件目录（JSON 等）
  
  # ============================================
  # 自定义字体配置（fonts）
  # ============================================
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
